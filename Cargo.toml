[package]
name = "bevy_sonus"
version = "0.1.0"
edition = "2024"
authors = ["zem-invictus <vovazms@gmail.com>"]
description = "A real-time spatial audio plugin for Bevy Engine featuring multi-ray obstruction, 3-band crossover occlusion filtering, acoustic material transmission, and sound diffraction."
repository = "https://github.com/zem-invictus/bevy_sonus"
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["assets/*", "examples/*"]
keywords = ["bevy", "audio", "spatial", "occlusion", "dsp"]
categories = ["multimedia::audio", "game-development"]

[dependencies]
bevy = { version = "0.19.0", features = ["jpeg"] }
bevy-inspector-egui = "0.37.0"
hound = "3.5.1"
rodio = { version = "0.22.2", default-features = false, features = ["wav"] }
ringbuf = "0.5.0"
bevy_skein = "0.6.0"

[[example]]
name = "demo"
path = "examples/demo.rs"

[profile.dev.package."*"]
opt-level = 3
